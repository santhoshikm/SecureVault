spring.application.name=securevault-backend

server.port=8080

# ==============================
# H2 IN-MEMORY DATABASE (DEV MODE — No PostgreSQL needed)
# ==============================
spring.datasource.url=jdbc:h2:mem:securevault_dev_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# JWT CONFIGURATION
# ==============================
jwt.secret=SecureVaultJwtSecretKey2024MustBeAtLeast32Bytes!
jwt.expiration=86400000

# ==============================
# AES-256 ENCRYPTION
# ==============================
encryption.key=SecureVaultEncryptionKey2026ABCD

# ==============================
# CORS CONFIGURATION
# ==============================
cors.allowed-origins=http://localhost:5173
