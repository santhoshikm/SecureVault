spring.application.name=securevault-backend

server.port=8080

# ==============================
# DATABASE CONFIGURATION
# Default: Embedded persistent H2 database (Zero setup required)
# To use PostgreSQL, set SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/securevault
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/securevault_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================
# JWT CONFIGURATION
# ==============================
jwt.secret=SecureVaultJwtSecretKey2024MustBeAtLeast32Bytes!
jwt.expiration=86400000

# ==============================
# AES-256 ENCRYPTION
# ==============================
encryption.key=SecureVaultEncryptionKey2026ABCD

# ==============================
# CORS CONFIGURATION
# ==============================
cors.allowed-origins=http://localhost:5173

# ==============================
# MAIL CONFIGURATION
# Configure with real SMTP credentials to enable email delivery
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true