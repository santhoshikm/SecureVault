spring.application.name=securevault-backend-test

# H2 Database configuration for isolated unit testing
spring.datasource.url=jdbc:h2:mem:securevault_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=SecureVaultJwtSecretKey2024MustBeAtLeast32Bytes!
jwt.expiration=86400000
encryption.key=SecureVaultEncryptionKey2026ABCD
cors.allowed-origins=http://localhost:5173

